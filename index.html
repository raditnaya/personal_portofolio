<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Portofolio</title>
    <!-- link -->
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- end link -->
  </head>
  <body>
    <header class="header">
      <nav class="navbar">
        <div class="navbar-spasi"></div>
        <div class="navbar-links" id="navbarA">
          <a href="index.html">Home</a>
          <a href="#aboutme">About Me</a>
          <a href="#contact">Contact</a>
          <a href="#">CV</a>
        </div>
        <div class="pilih-tema">
          <button id="select" class="menu-tarik-turun">
            <i class="fa-solid fa-angle-down"></i>
          </button>
          <div id="opsi-tema" class="opsi">
            <button id="tema-sun" class="tema"><i class="fa-solid fa-sun"></i> Cerah</button>
            <button id="tema-moon" class="tema"><i class="fa-solid fa-moon"></i> Gelap</button>
            <button id="tema-system" class="tema"><i class="fa-solid fa-computer"></i> Bawaan</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="article" id="aboutme">
        <img src="./img/knight pilih senjata.jpg" alt="profil" class="profil-img hilang-scroll" id="profilImg" />

        <article class="about">
          <div class="animasi-article">
            <h1 id="aboutMe">About Me</h1>
            <p id="aboutI"></p>
          </div>
        </article>
      </section>

      <section class="pemrograman">
        <h1 id="skillPemrograman" class="hilang-scroll">Skill</h1>
        <div class="kategori-skill" id="tabSkill">
          <button class="tab" data-kategori="semua">Semua</button>
          <button class="tab" data-kategori="bahasa-pemrograman">Bahasa Pemrograman</button>
          <button class="tab" data-kategori="alat">Alat</button>
        </div>

        <div class="bahasa-pemrograman" id="bahasaPemrograman">
          <!-- tab bahasa pemrograman -->
          <img src="./img/icons8-html-100.png" alt="html" class="bahasa-pemrograman-img" data-kategori="bahasa-pemrograman" />
          <img src="./img/icons8-css-100.png" alt="css" class="bahasa-pemrograman-img" data-kategori="bahasa-pemrograman" />
          <img src="./img/icons8-javascript-100.png" alt="javascript" class="bahasa-pemrograman-img" data-kategori="bahasa-pemrograman" />
          <img src="./img/icons8-java-100.png" alt="java" class="bahasa-pemrograman-img" data-kategori="bahasa-pemrograman" />
          <img src="./img/icons8-python-100.png" alt="python" class="bahasa-pemrograman-img" data-kategori="bahasa-pemrograman" />
          <img src="./img/icons8-mysql-100.png" alt="mysql" class="bahasa-pemrograman-img" data-kategori="bahasa-pemrograman" />
          <img src="./img/icons8-php-100.png" alt="php" class="bahasa-pemrograman-img" data-kategori="bahasa-pemrograman" />
          <!-- end tab bahasa pemrograman -->

          <!-- tab alat -->
          <img src="./img/icons8-vs-code-100.png" alt="vs code" class="bahasa-pemrograman-img" data-kategori="alat" />
          <img src="./img/icons8-git-100.png" alt="git" class="bahasa-pemrograman-img" data-kategori="alat" />
          <img src="./img/icons8-github-100.png" alt="github" class="bahasa-pemrograman-img" data-kategori="alat" />
          <img src="./img/icons8-docker-100.png" alt="docker" class="bahasa-pemrograman-img" data-kategori="alat" />
          <!-- end tab alat -->
        </div>
      </section>

      <section class="projek">
        <h1 class="hilang-scroll" id="projek">Projek</h1>
        <div class="daftar-projek" id="daftarProjek">
          <!-- projek 2 -->
          <div class="kartu-projek hilang-scroll">
            <div class="gambar-projek">
              <img src="./img/bank_Catatan_pelajaran.png" alt="bank_catatan_pelajaran" class="urutan-projek" />
            </div>
            <div class="detail-gambar-projek">
              <h3>Bank Catatan Pelajaran</h3>
              <p>Aplikasi web untuk mengelola, mencari, dan mengunggah materi pelajaran sekolah secara terstruktur.</p>
              <div class="tag-projek">
                <i class="fa-brands fa-html5" style="color: rgb(227, 79, 38)"></i>
                <i class="fa-brands fa-php" style="color: #777bb4"></i>
                <i class="fa-brands fa-bootstrap" style="color: #7952b3"></i>
                <i class="fa-brands fa-css3-alt" style="color: #264de4"></i>
                <i class="fa-brands fa-js" style="color: #f0db4f"></i>
                <i class="fa-solid fa-database icon-mysql"></i>
              </div>
              <div class="link-projek">
                <a href="https://bank-catatan-pelajaran.infinityfreeapp.com" target="_blank">Lihat Projek</a>
              </div>
            </div>
          </div>
          <!-- end projek 2 -->

          <!-- projek 3 -->
          
          <!-- end projek 3 -->
        </div>
      </section>

      <section class="contact" id="contact">
        <h1>Contact</h1>
        <div class="form-contact">
          <form action="">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tuliskan email anda" />
            <label for="pesan">Pesan</label>
            <textarea name="pesan" id="pesan" placeholder="tuliskan pesan anda"></textarea>
            <br />
            <button type="submit">Kirim</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>copyright &copy; 2026 di ketik oleh programmer pemula</p>
      <div class="footer-icon">
        <a href="https://www.instagram.com/?hl=en"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://www.facebook.com/"><i class="fa-brands fa-facebook"></i></a>
        <a href="https://x.com/X"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
    </footer>
    <script src="javascript/script.js"></script>
  </body>
</html>
